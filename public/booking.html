<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Book Your Stay | Hilton Hotels Clone</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/booking.css">

</head>


<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">
            HILTON
        </div>

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="hotels.html">
                Hotels
            </a>

            <a href="offers.html">
                Offers
            </a>

            <a href="about.html">
                About
            </a>

        </nav>

        <button class="sign-in-btn" onclick="window.location.href='signin.html'">
            Sign In
        </button>

    </header>


    <!-- ================= BOOKING PAGE ================= -->

    <main class="booking-container">

        <div class="booking-header">

            <h1>
                Complete Your Booking
            </h1>

            <p>
                Enter your details to reserve your stay.
            </p>

        </div>


        <div class="booking-layout">


            <!-- ================= HOTEL SUMMARY ================= -->

            <section class="hotel-summary">

                <div id="hotelSummary">

                    <p class="loading">
                        Loading hotel information...
                    </p>

                </div>

            </section>


            <!-- ================= BOOKING FORM ================= -->

            <section class="booking-form-card">

                <h2>
                    Guest Information
                </h2>

                <form id="bookingForm">

                    <div class="form-group">

                        <label for="guestName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="guestName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label for="checkIn">
                                Check-in
                            </label>

                            <input
                                type="date"
                                id="checkIn"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="checkOut">
                                Check-out
                            </label>

                            <input
                                type="date"
                                id="checkOut"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="guests">
                            Number of Guests
                        </label>

                        <select
                            id="guests"
                            required
                        >

                            <option value="1">
                                1 Guest
                            </option>

                            <option value="2" selected>
                                2 Guests
                            </option>

                            <option value="3">
                                3 Guests
                            </option>

                            <option value="4">
                                4 Guests
                            </option>

                            <option value="5">
                                5 Guests
                            </option>

                            <option value="6">
                                6 Guests
                            </option>

                        </select>

                    </div>


                    <!-- PRICE SUMMARY -->

                    <div class="price-summary">

                        <div>
                            <span>Price per night</span>
                            <strong id="pricePerNight">
                                $0
                            </strong>
                        </div>

                        <div>
                            <span>Nights</span>
                            <strong id="numberOfNights">
                                0
                            </strong>
                        </div>

                        <div class="total-row">
                            <span>Total</span>
                            <strong id="totalPrice">
                                $0
                            </strong>
                        </div>

                    </div>


                    <button
                        type="submit"
                        class="confirm-btn"
                    >
                        Confirm Booking
                    </button>

                </form>

                <p
                    id="formMessage"
                    class="form-message"
                ></p>

            </section>

        </div>

    </main>


    <script src="js/booking.js"></script>

</body>

</html>
